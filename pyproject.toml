[project]
name = "ai-model-evaluator"
version = "0.1.0"
description = "A universal tool for evaluating AI model performance and stability."
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "AI Tool Development Team", email = "dev@example.com"}
]
readme = "README.md"

dependencies = [
    "polars>=0.20.0", # For high-performance DataFrame manipulation
    "pyyaml>=6.0",    # For parsing YAML configuration files
    "pydantic>=2.0",  # For data validation and settings management
    "loguru>=0.7.0",  # For pleasant and powerful logging
    # Core algorithm & numerics
    "numpy>=1.20.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "shapely>=2.0.0", # For RIoU calculation
    "Pillow>=9.0.0",  # For image manipulation (drawing bboxes/skeletons)
    "motmetrics>=1.4.0", # For MOTA/MOTP calculation in tracking
    # Visualization
    "seaborn>=0.13.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    # Reporting
    "jinja2>=3.1.0",
    # API calls (for AI insights)
    "httpx>=0.25.0",
    # Optional for API if built later
    # "fastapi>=0.100.0",
    # "uvicorn[standard]>=0.23.0",
]

[project.scripts]
ai-eval = "ai_eval_tool.main_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    # "pyyaml>=6.0", # Already in main dependencies
    "black>=23.10.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "uv>=0.1.11", # For managing dependencies and virtual envs
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_eval_tool*"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = "E203" # Whitespace before ':' - conflicts with black
